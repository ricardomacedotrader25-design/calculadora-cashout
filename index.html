<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Calculadora – Entrada x Cashout (final)</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f7fb; --ink:#0f172a; --muted:#64748b; --card:#ffffff; --line:#e6eaf2;
    --green:#16a34a; --red:#ef4444; --amber:#b45309;
    --radius:18px; --radius-sm:12px; --shadow:0 10px 30px rgba(10,20,40,.08);
    --pill-radius:30px; /* cantos 30px fixo */
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{
    margin:0; font-family:'Montserrat',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:
      radial-gradient(1000px 600px at 15% -10%, #eaf1ff 0%, transparent 60%),
      radial-gradient(800px 600px at 100% 0%, #e9feff 0%, transparent 55%), var(--bg);
    color:var(--ink); display:flex; align-items:center; justify-content:center; padding:28px;
  }
  .card{ width:min(940px,98vw); background:linear-gradient(180deg,#fff 0%,#fafcff 100%);
    border:1px solid var(--line); border-radius:calc(var(--radius)+2px); box-shadow:var(--shadow); padding:28px; }
  .title{ margin:0 0 8px; font-weight:800; letter-spacing:.2px; font-size:clamp(18px,2.4vw,24px); color:#0b1220 }
  .subtitle{ margin:0 0 22px; color:var(--muted); font-size:14px }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:22px } @media (max-width:720px){ .grid{grid-template-columns:1fr} }
  .panel{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 18px 16px }
  label{ display:block; font-size:13px; color:var(--muted); margin:0 0 10px; letter-spacing:.2px }
  .inputWrap{ display:flex; align-items:center; gap:10px; background:#f7f9ff; border:1px solid #dfe7ff; border-radius:14px; padding:14px 16px }
  .inputWrap:focus-within{ border-color:#c7d2fe; box-shadow:0 0 0 4px rgba(59,130,246,.12) }
  .prefix{ font-weight:800; color:#4b5563; opacity:.9 }
  input{ width:100%; font-size:22px; background:transparent; border:0; outline:0; color:#0b1220; letter-spacing:.2px }
  input::placeholder{ color:#9aa8ba }
  .hint{ margin-top:8px; color:#7b8aa3; font-size:12px }
  .rowtitle{ text-align:center; color:#5b6b83; font-size:12px; letter-spacing:1.6px; margin:14px 0 12px; text-transform:uppercase }
  .badges{ display:grid; grid-template-columns:1.1fr .9fr; gap:18px } @media (max-width:720px){ .badges{grid-template-columns:1fr} }
  .pill{
    display:flex; align-items:center; justify-content:center; border-radius:var(--pill-radius);
    padding:14px 18px; font-weight:800; letter-spacing:.4px; font-size:clamp(22px,5vw,36px);
    border:2px solid #dbe4ff; background:linear-gradient(180deg,#fff,#f1f5ff); color:#1f2937;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 6px 20px rgba(37,99,235,.07);
  }
  .pill--green{ border-color:rgba(34,197,94,.35); background:linear-gradient(180deg,#ecfdf5,#e8fff4); color:var(--green) }
  .pill--red{ border-color:rgba(239,68,68,.35); background:linear-gradient(180deg,#fff1f2,#ffecec); color:var(--red) }
  .pill--zero{ border-color:rgba(180,130,50,.3); background:linear-gradient(180deg,#fffaf0,#fff8e6); color:var(--amber) }
  .panel .mini{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:10px }
  .chip{ padding:10px 14px; border-radius:var(--radius-sm); border:1px solid var(--line); background:#fff; color:#3b4454; font-weight:700 }
  .chip strong{ color:#0b1220 }
  .footer{ display:flex; gap:10px; margin-top:18px; flex-wrap:wrap }
  button{ appearance:none; border:0; cursor:pointer; padding:12px 16px; border-radius:12px; font-weight:800;
    border:1px solid #dbe4ff; background:linear-gradient(180deg,#fff,#eef3ff); color:#1e293b }
</style>
</head>
<body>
  <main class="card">
    <h1 class="title">Calculadora de Entrada x Cashout</h1>
    <p class="subtitle">Preencha o valor de entrada e o cashout. O cálculo é feito automaticamente.</p>

    <section class="grid">
      <div class="panel">
        <label for="entrada">Entrada</label>
        <div class="inputWrap">
          <span class="prefix">R$</span>
          <input id="entrada" inputmode="decimal" placeholder="0,00" value="" />
        </div>
        <p class="hint">Digite com vírgula ou ponto.</p>
      </div>

      <div class="panel">
        <label for="cashout">Cashout</label>
        <div class="inputWrap">
          <span class="prefix">R$</span>
          <input id="cashout" inputmode="decimal" placeholder="0,00" value="" />
        </div>
        <p class="hint">Preencha durante o jogo.</p>
      </div>
    </section>

    <div class="rowtitle">SAÍDA</div>
    <div class="badges">
      <div id="percentPill" class="pill pill--zero">0,00%</div>
      <div class="panel">
        <div class="mini">
          <div class="chip">Cashout: <strong id="outValue">R$ 0,00</strong></div>
          <div class="chip">Diferença: <strong id="diffValue">R$ 0,00</strong></div>
        </div>
        <div class="mini">
          <div class="chip">Entrada: <strong id="inValue">R$ 0,00</strong></div>
          <div class="chip">Status: <strong id="statusText">Neutro</strong></div>
        </div>
      </div>
    </div>

    <div class="footer">
      <button id="resetBtn">Zerar</button>
    </div>
  </main>

<script>
(function(){
  // formatadores
  const fmtBR = new Intl.NumberFormat('pt-BR',{ style:'currency', currency:'BRL' });
  const fmtPct = new Intl.NumberFormat('pt-BR',{ minimumFractionDigits:2, maximumFractionDigits:2 });
  const fmtNum = new Intl.NumberFormat('pt-BR',{ minimumFractionDigits:2, maximumFractionDigits:2 }); // inputs sem R$

  // elementos
  const entradaEl=document.getElementById('entrada');
  const cashoutEl=document.getElementById('cashout');
  const percentPill=document.getElementById('percentPill');
  const inValue=document.getElementById('inValue');
  const outValue=document.getElementById('outValue');
  const diffValue=document.getElementById('diffValue');
  const statusText=document.getElementById('statusText');
  const resetBtn=document.getElementById('resetBtn');

  // helpers
  function toNumber(str){
    const s=String(str ?? '').replace(/\s|R\$/g,'').replace(/\./g,'').replace(',','.');
    const n=parseFloat(s); return isFinite(n)?n:0;
  }
  function formatInput(el){
    const n=toNumber(el.value);
    el.value = n ? fmtNum.format(n) : '';
  }

  // cálculo
  function calc(){
    const entrada=toNumber(entradaEl.value);
    const cashout=toNumber(cashoutEl.value);

    inValue.textContent=fmtBR.format(entrada||0);
    outValue.textContent=fmtBR.format(cashout||0);

    if(!entrada||!cashout){
      percentPill.className='pill pill--zero';
      percentPill.textContent='0,00%';
      diffValue.textContent=fmtBR.format(0);
      statusText.textContent='Neutro';
      return;
    }
    const diff=cashout-entrada;
    const pct=(diff/entrada)*100;

    diffValue.textContent=fmtBR.format(diff);
    if(pct>0){ percentPill.className='pill pill--green'; statusText.textContent='Lucro'; }
    else if(pct<0){ percentPill.className='pill pill--red'; statusText.textContent='Prejuízo'; }
    else{ percentPill.className='pill pill--zero'; statusText.textContent='Neutro'; }

    percentPill.textContent=fmtPct.format(pct)+'%';
  }

  // eventos
  ['input','change','keyup','blur'].forEach(ev=>{
    entradaEl.addEventListener(ev, ev==='blur'? ()=>formatInput(entradaEl): calc);
    cashoutEl.addEventListener(ev, ev==='blur'? ()=>formatInput(cashoutEl): calc);
  });

  // botão zerar
  resetBtn.addEventListener('click', ()=>{
    entradaEl.value=''; cashoutEl.value='';
    calc(); entradaEl.focus();
  });

  // inicia zerado
  calc();
})();
</script>
</body>
</html>
